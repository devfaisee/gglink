<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found &mdash; GGLINK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; background-color: #09090b; color: #f4f4f5; }
    .subtle-grid { background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 24px 24px; }
    .glass-panel { background: rgba(18, 18, 23, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 subtle-grid">
  <div class="max-w-sm w-full glass-panel rounded-2xl p-7 text-center space-y-4">
    <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center mx-auto text-zinc-400 text-sm font-mono">
      404
    </div>
    <h1 class="text-lg font-semibold text-white tracking-tight">Media Not Found</h1>
    <p class="text-xs text-zinc-400 leading-relaxed">
      This link has either expired or was deleted by its sender.
    </p>
    <div class="pt-2">
      <a href="/" class="inline-block px-5 py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-medium text-xs transition">
        Create New Link
      </a>
    </div>
  </div>
</body>
</html>
