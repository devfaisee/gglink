<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shared Media &mdash; GGLINK</title>
  
  <!-- DYNAMIC_META -->
  <meta name="theme-color" content="#09090b">
  <meta property="og:site_name" content="GGLINK">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Instant SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23ffffff'/><text x='50%' y='55%' font-family='sans-serif' font-weight='900' font-size='50' fill='%2309090b' text-anchor='middle' dominant-baseline='central'>GG</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-font-smoothing: antialiased;
    }
    .subtle-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(18, 18, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black subtle-grid">

  <!-- Minimal Header -->
  <header class="w-full border-b border-white/[0.06] bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-5 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-zinc-950 font-bold text-xs">
          GG
        </div>
        <span class="font-semibold text-sm tracking-tight text-white">GGLINK</span>
      </a>
      <a href="/" class="text-xs text-zinc-300 hover:text-white font-medium bg-zinc-900 border border-white/10 px-3 py-1.5 rounded-lg transition">
        + Share Media
      </a>
    </div>
  </header>

  <!-- Main Viewer Content (No Ads, Zero Distractions) -->
  <main class="max-w-md mx-auto w-full px-5 py-6 flex-1 flex flex-col justify-center">

    <!-- Loading Skeleton -->
    <div id="loader" class="glass-panel rounded-2xl p-8 text-center space-y-3 animate-pulse">
      <div class="w-6 h-6 border-2 border-white/20 border-t-white rounded-full animate-spin mx-auto"></div>
      <div class="text-xs text-zinc-400">Loading media...</div>
    </div>

    <!-- Active Media Card -->
    <div id="mediaCard" class="hidden glass-panel rounded-2xl p-6 shadow-2xl space-y-5">
      
      <!-- Top meta info -->
      <div class="flex items-center justify-between border-b border-white/[0.06] pb-3 text-xs">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="font-medium text-zinc-300" id="typeLabel">Shared Media</span>
        </div>
        <div class="flex items-center space-x-3 text-zinc-400 text-[11px]">
          <span class="flex items-center space-x-1">
            <i class="fa-regular fa-eye"></i>
            <span id="viewCount">1</span>
          </span>
          <span id="expiryBadge" class="hidden text-amber-400">
            <i class="fa-regular fa-clock"></i> Expires
          </span>
        </div>
      </div>

      <!-- VOICE NOTE PLAYER -->
      <div id="voiceSection" class="hidden space-y-4 py-2">
        <div class="flex items-center space-x-4">
          <button id="playBtn" class="w-14 h-14 rounded-full bg-white hover:bg-zinc-200 text-zinc-950 flex items-center justify-center transition shadow-lg flex-shrink-0 active:scale-95 cursor-pointer">
            <i class="fa-solid fa-play text-lg ml-0.5" id="playIcon"></i>
          </button>
          
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between text-xs mb-1.5">
              <span class="font-medium text-zinc-200">Voice Note</span>
              <span class="font-mono text-zinc-400 text-[11px]" id="timeDisplay">0:00</span>
            </div>
            
            <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden cursor-pointer" id="progressTrack">
              <div id="progressBar" class="bg-white h-full w-0 transition-all duration-75"></div>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-white/[0.04] text-[11px] text-zinc-400">
          <span>Speed</span>
          <div class="flex items-center space-x-1">
            <button id="speedBtn" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition font-mono">
              1.0x
            </button>
          </div>
        </div>

        <audio id="audioEl" class="hidden"></audio>
      </div>

      <!-- SCREENSHOT / IMAGE -->
      <div id="imageSection" class="hidden">
        <div class="rounded-xl overflow-hidden border border-white/[0.08] bg-black">
          <img id="mainImage" src="" alt="Screenshot" class="w-full max-h-[460px] object-contain">
        </div>
      </div>

      <!-- SHORTENED REDIRECT LINK -->
      <div id="linkSection" class="hidden text-center py-4 space-y-3">
        <div class="w-12 h-12 rounded-xl bg-zinc-800 border border-white/10 flex items-center justify-center mx-auto text-zinc-200">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </div>
        <div class="text-xs text-zinc-400 truncate px-4 font-mono" id="destUrl"></div>
        <a id="openLinkBtn" href="#" target="_blank" class="inline-block py-2.5 px-6 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-xs tracking-tight transition">
          Open In-Game Link &rarr;
        </a>
      </div>

      <!-- Copy / Share Bar -->
      <div class="pt-3 border-t border-white/[0.06] flex items-center justify-between text-xs text-zinc-400">
        <span class="truncate font-mono text-[11px] text-zinc-500" id="currentUrl"></span>
        <button id="copyShareBtn" class="text-zinc-200 hover:text-white font-medium ml-2 flex items-center space-x-1 whitespace-nowrap bg-zinc-800 px-2.5 py-1 rounded-md transition text-[11px]">
          <i class="fa-regular fa-copy"></i>
          <span id="copyShareText">Copy Link</span>
        </button>
      </div>

    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="w-full border-t border-white/[0.06] py-4 text-center text-xs text-zinc-500">
    <div class="max-w-md mx-auto px-5 flex items-center justify-between text-[11px]">
      <span>Shared via GGLINK</span>
      <a href="/" class="text-zinc-400 hover:text-white transition">
        Create Your Own Link &rarr;
      </a>
    </div>
  </footer>

  <script>
    const slug = window.location.pathname.replace(/^\//, '');

    const loader = document.getElementById('loader');
    const mediaCard = document.getElementById('mediaCard');
    const typeLabel = document.getElementById('typeLabel');
    const viewCount = document.getElementById('viewCount');
    const expiryBadge = document.getElementById('expiryBadge');

    const voiceSection = document.getElementById('voiceSection');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const timeDisplay = document.getElementById('timeDisplay');
    const audioEl = document.getElementById('audioEl');
    const progressBar = document.getElementById('progressBar');
    const progressTrack = document.getElementById('progressTrack');
    const speedBtn = document.getElementById('speedBtn');

    const imageSection = document.getElementById('imageSection');
    const mainImage = document.getElementById('mainImage');

    const linkSection = document.getElementById('linkSection');
    const destUrl = document.getElementById('destUrl');
    const openLinkBtn = document.getElementById('openLinkBtn');

    const currentUrl = document.getElementById('currentUrl');
    const copyShareBtn = document.getElementById('copyShareBtn');
    const copyShareText = document.getElementById('copyShareText');

    currentUrl.innerText = window.location.href;

    copyShareBtn.onclick = () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        copyShareText.innerText = 'Copied!';
        setTimeout(() => { copyShareText.innerText = 'Copy Link'; }, 2000);
      });
    };

    async function fetchMedia() {
      try {
        const res = await fetch(`/api/drop/${slug}`);
        if (!res.ok) {
          window.location.href = '/404.html';
          return;
        }

        const data = await res.json();
        viewCount.innerText = data.views || 1;

        if (data.expiresAt) {
          expiryBadge.classList.remove('hidden');
        }

        if (data.mediaType === 'audio') {
          typeLabel.innerText = 'Voice Note';
          voiceSection.classList.remove('hidden');
          audioEl.src = data.mediaUrl;

          audioEl.onloadedmetadata = () => {
            const m = Math.floor(audioEl.duration / 60);
            const s = Math.floor(audioEl.duration % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${m}:${s}`;
          };

          audioEl.ontimeupdate = () => {
            const pct = (audioEl.currentTime / audioEl.duration) * 100;
            progressBar.style.width = `${pct}%`;
            const cm = Math.floor(audioEl.currentTime / 60);
            const cs = Math.floor(audioEl.currentTime % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${cm}:${cs}`;
          };

          audioEl.onended = () => {
            playIcon.className = 'fa-solid fa-play text-lg ml-0.5';
            progressBar.style.width = '0%';
          };

          playBtn.onclick = () => {
            if (audioEl.paused) {
              audioEl.play();
              playIcon.className = 'fa-solid fa-pause text-lg';
            } else {
              audioEl.pause();
              playIcon.className = 'fa-solid fa-play text-lg ml-0.5';
            }
          };

          progressTrack.onclick = (e) => {
            const rect = progressTrack.getBoundingClientRect();
            const clickPos = (e.clientX - rect.left) / rect.width;
            audioEl.currentTime = clickPos * audioEl.duration;
          };

          const speeds = [1.0, 1.5, 2.0];
          let speedIdx = 0;
          speedBtn.onclick = () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            audioEl.playbackRate = speeds[speedIdx];
            speedBtn.innerText = `${speeds[speedIdx].toFixed(1)}x`;
          };

        } else if (data.mediaType === 'image') {
          typeLabel.innerText = 'Screenshot';
          imageSection.classList.remove('hidden');
          mainImage.src = data.mediaUrl;

        } else {
          typeLabel.innerText = 'Link';
          linkSection.classList.remove('hidden');
          destUrl.innerText = data.mediaUrl;
          openLinkBtn.href = data.mediaUrl;
        }

        loader.classList.add('hidden');
        mediaCard.classList.remove('hidden');

      } catch (err) {
        console.error('Failed to load:', err);
      }
    }

    fetchMedia();
  </script>
</body>
</html>
